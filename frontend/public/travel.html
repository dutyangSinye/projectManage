<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>差旅标准查询</title>
<style>
  :root { --bg:#f5f7fa; --panel:#ffffff; --ink:#1f2329; --sub:#7a869a; --line:#e5e8ef;
          --brand:#2f7cff; --brand-d:#1f63d6; --red:#d9302b; --green:#1a8a3a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif; }
  .wrap { max-width:560px; margin:0 auto; padding:18px 16px 40px; }
  h1 { font-size:20px; margin:6px 0 2px; }
  .tip { color:var(--sub); font-size:13px; margin-bottom:16px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px; }
  label { display:block; font-size:13px; color:var(--sub); margin:0 0 6px; }
  input, select { width:100%; padding:12px; font-size:16px; border:1px solid var(--line);
                  border-radius:10px; background:#fff; color:var(--ink); outline:none; }
  input:focus, select:focus { border-color:var(--brand); }
  input:focus-visible, select:focus-visible, button:focus-visible {
    outline:3px solid rgba(47,124,255,.22); outline-offset:2px;
  }
  .row { display:flex; gap:10px; align-items:flex-end; }
  .row .col { flex:1; }
  .fields { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:14px; }
  .swap { height:44px; border:1px solid var(--line); background:#fff; border-radius:10px; padding:0 14px;
          color:var(--brand); font-size:14px; cursor:pointer; white-space:nowrap; }
  .btn { width:100%; margin-top:16px; padding:14px; background:var(--brand); color:#fff;
         border:none; border-radius:11px; font-size:16px; font-weight:600; cursor:pointer; }
  .btn:active { background:var(--brand-d); }
  .result { margin-top:18px; }
  .tag { display:inline-block; padding:4px 10px; border-radius:999px; font-size:13px; margin-bottom:10px; }
  .t-green { background:#e6f4ea; color:var(--green); }
  .t-blue  { background:#e8f0ff; color:var(--brand); }
  .t-purple{ background:#f3eaff; color:#7a3bd6; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .item { background:#fafbfc; border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
  .item.full { grid-column:1 / -1; }
  .item.hl { background:#fff5f5; border-color:#f3d4d4; }
  .k { font-size:12px; color:var(--sub); }
  .v { font-size:17px; font-weight:600; margin-top:3px; }
  .v.red { color:var(--red); }
  .empty { padding:24px; text-align:center; color:var(--sub); line-height:1.7; }
  .note { color:var(--sub); font-size:12px; margin-top:10px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>差旅标准查询</h1>
  <div class="tip">输入出发地、目的地、职级，自动带出里程·地区·折扣·限价·住宿·补助。表内城市按精确标准；未收录城市按「三类地区」推算。里程 &gt;1000km 推荐坐飞机，住宿补助按最终到达地点为准。<br><b style="color:#c0392b">⚠️ 机票价格仅供参考，一切以实际为准</b></div>

  <div class="card">
    <div class="row">
      <div class="col">
        <label for="from">出发地</label>
        <input id="from" list="cityList" placeholder="如：成都 / 北京 / 雄安">
      </div>
      <button class="swap" id="swapBtn">⇄ 交换</button>
    </div>
    <div style="height:12px"></div>
    <label for="to">目的地</label>
    <input id="to" list="cityList" placeholder="如：北京 / 雄安 / 开封">
    <div class="fields">
      <div>
        <label for="level">员工职级</label>
        <select id="level"></select>
      </div>
      <div>
        <label for="from2">&nbsp;</label>
        <button class="btn" id="searchBtn" style="margin-top:0">查 询</button>
      </div>
    </div>
  </div>

  <div class="result" id="result"></div>

  <datalist id="cityList"></datalist>
  <div style="text-align:center;font-size:12px;color:#8a8f99;margin-top:14px">标准版本：2026-10-21　火车舱位按新标准</div>
</div>

<script>
const STANDARDS = window.STANDARDS || [];
const REGION = window.REGION || {};
const LEVEL_RULE = window.LEVEL_RULE || {};
const HOTEL = window.HOTEL || {};
const MILEAGE = window.MILEAGE || {};
const CITY_PROV = window.CITY_PROV || window.CITY_TO_PROVINCE || {};
const CITY_TO_PROVINCE = window.CITY_TO_PROVINCE || CITY_PROV;
const REF_CITY = window.REF_CITY || {};
const PROVINCE_CAPITAL = window.PROVINCE_CAPITAL || {};
const DEFAULT_REGION = window.DEFAULT_REGION || '三类';
const DEFAULT_FROM = window.DEFAULT_FROM || '成都';
const $ = id => document.getElementById(id);
const norm = s => (s || '').trim();
const escapeHtml = value => String(value ?? '').replace(/[&<>'"]/g, char => ({
  '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;'
})[char]);

// 表外城市参考城市查找：优先显式 REF_CITY 覆盖，否则取其省会/直辖市
function getRefCity(city){
  if (REF_CITY[city]) return REF_CITY[city];
  const prov = CITY_TO_PROVINCE[city];
  if (prov && PROVINCE_CAPITAL[prov]) return PROVINCE_CAPITAL[prov];
  return null;
}

// 动态生成职级下拉（与数据一致），默认选中「C 普通员工」
const LEVELS = Object.keys(LEVEL_RULE);
$('level').innerHTML = LEVELS.map(l => `<option value="${l}">${l}</option>`).join('');
if(LEVELS.includes('C 普通员工')) $('level').value = 'C 普通员工';
document.getElementById('cnt') && ($('cnt').textContent = STANDARDS.length);

// 城市下拉建议
(function buildCityList(){
  const set = new Set();
  STANDARDS.forEach(r => { set.add(r.from); set.add(r.to); });
  $('cityList').innerHTML = [...set].sort().map(c => `<option value="${c}">`).join('');
})();

function lookup(from, to, level){
  const nf = norm(from), nt = norm(to);
  let row = STANDARDS.find(r => norm(r.from)===nf && norm(r.to)===nt && norm(r.level)===level);
  if(row) return { row, mode:'精确', note:'', from, to, level };
  let rev = STANDARDS.find(r => norm(r.from)===nt && norm(r.to)===nf && norm(r.level)===level);
  if(rev) return { row:rev, mode:'反向', note:`（按反向 ${nt}→${nf} 匹配，请核对方向）`, from, to, level };

  // 推算：表外城市 / 表内但无该路线。住宿/补助按最终到达地点判定（REGION[到达城市]）
  const region = REGION[nt] || DEFAULT_REGION;
  const lr = LEVEL_RULE[level] || LEVEL_RULE['C 普通员工'];
  const hr = HOTEL[region] || HOTEL[DEFAULT_REGION];

  // 里程：原表 → 到达地表外按参考城市（用省会/直辖市，REF_CITY 可覆盖）→
  //       出发地表外按参考城市 → 兜底「公司常驻出发地（成都）→ 参考城市」
  let m = (MILEAGE[nf] && MILEAGE[nf][nt]) || (MILEAGE[nt] && MILEAGE[nt][nf]) || null;
  let refCity = null, refUsed = false, refFrom = null;
  if(m == null && !REGION[nt]){
    const rc = getRefCity(nt);
    if(rc && rc !== nf){
      refCity = rc;
      if(MILEAGE[nf] && MILEAGE[nf][refCity]) { m = MILEAGE[nf][refCity]; refUsed = true; }
      else if(MILEAGE[refCity] && MILEAGE[refCity][nf]) { m = MILEAGE[refCity][nf]; refUsed = true; }
    } else if(rc === nf){
      // 目的地参考城市=出发地（省内），不取兜底里程，由下方"省内例外"分支判定高铁
      refCity = rc;
    }
  }
  if(m == null && !REGION[nf]){
    const rc = getRefCity(nf);
    if(rc && rc !== nt){
      refCity = rc;
      if(MILEAGE[refCity] && MILEAGE[refCity][nt]) { m = MILEAGE[refCity][nt]; refUsed = true; }
      else if(MILEAGE[nt] && MILEAGE[nt][refCity]) { m = MILEAGE[nt][refCity]; refUsed = true; }
    } else if(rc === nt){
      refCity = rc;
    }
  }
  if(m == null && refCity && DEFAULT_FROM && DEFAULT_FROM !== nf && DEFAULT_FROM !== refCity && refCity !== nf && refCity !== nt){
    refFrom = DEFAULT_FROM;
    if(MILEAGE[refFrom] && MILEAGE[refFrom][refCity]) { m = MILEAGE[refFrom][refCity]; refUsed = true; }
    else if(MILEAGE[refCity] && MILEAGE[refCity][refFrom]) { m = MILEAGE[refCity][refFrom]; refUsed = true; }
  }

  // 交通推荐：有里程 → 严格按里程 >1000km 推荐飞机；
  // 无里程 + 目的地的参考城市=出发地（省内）→ 高铁；
  // 其余无里程 + 含表外城市 → 飞机+高铁长途差旅；
  // 两端表内但无里程 → 高铁+提示
  let transport, note = '';
  if(m != null){
    transport = (m >= 1000) ? '推荐乘坐飞机' : '推荐乘坐高铁/火车';
  } else if(refCity && refCity === nf){
    transport = '推荐乘坐高铁/火车';
    note = '（目的地在出发地所在省（参考城市一致），按省内短途推荐高铁）';
  } else if(!REGION[nt] || !REGION[nf]){
    transport = '✈️ 飞机 + 🚄 高铁（长途差旅：先飞至参考城市/枢纽，再转高铁）';
    note = '（两地未收录里程；按「飞机到省会/直辖市再高铁接驳」处理，折扣按职级、住宿补助按到达地）';
  } else {
    transport = '推荐乘坐高铁/火车';
    note = '（两地里程未维护，交通建议仅供参考，请核实）';
  }
  const hotel = (level === 'C 普通员工') ? hr.c : hr.ab;
  const r = {
    from, to, level,
    mileage: m == null ? '—' : m,
    region,
    transport,
    discount: lr.discount,
    fullPrice: '—',
    maxPrice: '—',
    train: lr.train,
    ship: lr.ship || '—',
    hotel,
    allowance: hr.allowance
  };

  // 推荐飞机且用到参考城市：按参考城市回填机票全价、最高限价（含公司常驻出发地兜底）
  if(transport.includes('飞机') && refCity){
    let refRow = STANDARDS.find(x => norm(x.from)===nf && norm(x.to)===refCity && norm(x.level)===level);
    if(!refRow) refRow = STANDARDS.find(x => norm(x.from)===refCity && norm(x.to)===nt && norm(x.level)===level);
    if(!refRow) refRow = STANDARDS.find(x => norm(x.from)===refCity && norm(x.to)===nf && norm(x.level)===level);
    if(!refRow) refRow = STANDARDS.find(x => norm(x.from)===nt && norm(x.to)===refCity && norm(x.level)===level);
    if(!refRow && refFrom) refRow = STANDARDS.find(x => norm(x.from)===refFrom && norm(x.to)===refCity && norm(x.level)===level);
    if(!refRow && refFrom) refRow = STANDARDS.find(x => norm(x.from)===refCity && norm(x.to)===refFrom && norm(x.level)===level);
    if(refRow){
      r.fullPrice = refRow.fullPrice;
      r.maxPrice = refRow.maxPrice;
      refUsed = true;
    }
  }
  if(refUsed && !note.includes('参考城市')){
    if(refFrom) note += `（参考价按公司常驻出发地 ${refFrom} → 参考城市 ${refCity} 计算）`;
    else note += `（按参考城市 ${refCity} 计算）`;
  }

  return { row:r, mode:'推算', note, from, to, level };
}

function fmtMoney(n){
  if(typeof n === 'number') return '¥' + n;
  if(n === '' || n == null) return '—';
  return n;
}

function render(res){
  const box = $('result');
  const key = `${res.from||'？'} → ${res.to||'？'} · ${res.level||'未选择职级'}`;
  const safeKey = escapeHtml(key);
  if(!res.row){
    box.innerHTML = `<div class="card"><div class="empty">😕 未找到匹配标准<br><br>查询条件：<b>${safeKey}</b><br><br>请检查城市名称或职级是否录入正确。</div></div>`;
    return;
  }
  const tagClass = res.mode==='精确' ? 't-green' : (res.mode==='反向' ? 't-blue' : 't-purple');
  const tagText = res.mode==='精确' ? '✅ 精确匹配' : (res.mode==='反向' ? '🔁 反向匹配' : '🟣 按地区推算');
  const r = res.row;
  box.innerHTML = `<div class="card">
    <span class="tag ${tagClass}">${tagText}：${safeKey}</span>
    <div class="grid">
      <div class="item"><div class="k">两地里程</div><div class="v">${escapeHtml(r.mileage)} ${r.mileage!=='—'?'km':''}</div></div>
      <div class="item"><div class="k">地区等级</div><div class="v">${escapeHtml(r.region)}${res.mode==='推算'?'（按到达地判定）':''}</div></div>
      <div class="item full"><div class="k">交通推荐方案</div><div class="v">${escapeHtml(r.transport)}</div></div>
      <div class="item hl"><div class="k">允许机票折扣</div><div class="v red">${escapeHtml(r.discount)}</div></div>
      <div class="item hl"><div class="k">机票最高限价</div><div class="v red">${escapeHtml(fmtMoney(r.maxPrice))}</div></div>
      <div class="item"><div class="k">机票全价</div><div class="v">${escapeHtml(fmtMoney(r.fullPrice))}</div></div>
      <div class="item"><div class="k">允许火车舱位</div><div class="v">${escapeHtml(r.train)}</div></div>
      <div class="item full"><div class="k">允许轮船舱位（如涉及水路）</div><div class="v">${escapeHtml(r.ship || '—')}</div></div>
      <div class="item"><div class="k">单日住宿标准</div><div class="v">${escapeHtml(fmtMoney(r.hotel))}</div></div>
      <div class="item"><div class="k">单日出差补助</div><div class="v">${escapeHtml(fmtMoney(r.allowance))}</div></div>
    </div>
    ${res.note ? `<div class="note">⚠️ ${escapeHtml(res.note)}</div>` : ''}
    <div class="note" style="margin-top:4px">⚠️ 机票价格仅供参考，一切以实际为准</div>
  </div>`;
}

function doSearch(){
  const from = norm($('from').value);
  const to   = norm($('to').value);
  const level= $('level').value;
  if(!from || !to){ render({row:null}); return; }
  render(lookup(from, to, level));
}
$('searchBtn').addEventListener('click', doSearch);
$('swapBtn').addEventListener('click', () => {
  const f = $('from').value; $('from').value = $('to').value; $('to').value = f;
});
['from','to'].forEach(id => $(id).addEventListener('keydown', e => { if(e.key==='Enter') doSearch(); }));
</script>
</body>
</html>
