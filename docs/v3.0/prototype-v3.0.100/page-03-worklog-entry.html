<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>填报工时 · v3.0.100 原型</title>
<style>
:root{--primary:#0f766e;--primary-soft:#ccfbf1;--success:#15803d;--warning:#b45309;--warning-soft:#fff7ed;--error:#b91c1c;--error-soft:#fef2f2;--info:#2563eb;--page:#f6f8fa;--surface:#ffffff;--muted:#eef2f4;--text:#17202a;--body:#344054;--sub:#667085;--border:#d0d5dd;--white:#ffffff;--disabled:#98a2b3;--shadow:0 12px 36px rgba(23,32,42,.12);--fs-cap:12px;--fs-sm:14px;--fs-body:16px;--fs-title:20px;--fs-page:24px;--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s6:24px;--s8:32px;--r1:4px;--r2:8px;--touch:44px}
*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--body);font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;font-size:var(--fs-sm);letter-spacing:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--primary-soft);outline-offset:2px}.top{height:64px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 var(--s6)}.top a{color:var(--primary);text-decoration:none}.wrap{max-width:900px;margin:0 auto;padding:var(--s6)}.statebar{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;margin-bottom:var(--s4)}.statebar b{margin-right:auto;color:var(--text)}.statebar button{min-height:36px;padding:0 var(--s3);border:1px solid var(--border);background:var(--surface);color:var(--sub);border-radius:var(--r1)}.statebar button.on{background:var(--primary);border-color:var(--primary);color:var(--white)}.pagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--s4);margin-bottom:var(--s6)}h1{font-size:var(--fs-page);margin:0;color:var(--text)}.pagehead p{margin:var(--s1) 0 0;color:var(--sub)}.btn{min-height:var(--touch);padding:0 var(--s4);border:1px solid var(--border);border-radius:var(--r2);background:var(--surface);color:var(--body);font-weight:600}.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--white)}.btn:disabled{background:var(--muted);border-color:var(--border);color:var(--disabled);cursor:not-allowed}.editor{background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);box-shadow:var(--shadow);overflow:hidden}.stateview{display:none}.stateview.on{display:block}.form{padding:var(--s6)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--s4)}.field{min-width:0}.field.full{grid-column:1/-1}.field label{display:block;font-weight:600;color:var(--text);margin-bottom:var(--s2)}.field label small{color:var(--error)}.control{width:100%;height:var(--touch);border:1px solid var(--border);border-radius:var(--r1);background:var(--surface);color:var(--body);padding:0 var(--s3)}textarea.control{height:112px;padding-top:var(--s3);resize:vertical}.helper{display:block;margin-top:var(--s1);color:var(--sub);font-size:var(--fs-cap)}.picker{position:relative}.pickerbtn{width:100%;min-height:56px;border:1px solid var(--border);border-radius:var(--r1);background:var(--surface);padding:var(--s2) var(--s3);display:flex;align-items:center;justify-content:space-between;text-align:left;color:var(--body)}.pickerbtn strong{display:block;color:var(--text)}.pickerbtn small{display:block;color:var(--sub);margin-top:var(--s1)}.options{display:none;position:absolute;z-index:3;left:0;right:0;top:calc(100% + var(--s1));background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);box-shadow:var(--shadow);padding:var(--s2)}.options.on{display:block}.option{width:100%;min-height:60px;border:0;border-radius:var(--r1);background:transparent;padding:var(--s2) var(--s3);display:flex;justify-content:space-between;align-items:center;text-align:left;color:var(--body)}.option:hover,.option.selected{background:var(--primary-soft)}.option strong{display:block;color:var(--text)}.option small{display:block;color:var(--sub);margin-top:var(--s1)}.option b{color:var(--primary)}.budgetline{grid-column:1/-1;border:1px solid var(--border);border-left:4px solid var(--primary);border-radius:var(--r1);padding:var(--s4);display:grid;grid-template-columns:1fr auto;gap:var(--s4);background:var(--page)}.budgetline.warning{border-color:var(--warning);background:var(--warning-soft)}.budgetline.error{border-color:var(--error);background:var(--error-soft)}.budgetline h2{font-size:var(--fs-body);margin:0;color:var(--text)}.budgetline.warning h2{color:var(--warning)}.budgetline.error h2{color:var(--error)}.budgetline p{margin:var(--s1) 0 0;color:var(--sub)}.budgetmeta{display:flex;gap:var(--s4);align-items:center;text-align:right}.budgetmeta span{display:block;color:var(--sub);font-size:var(--fs-cap)}.budgetmeta strong{display:block;color:var(--text);font-variant-numeric:tabular-nums}.rail{height:8px;background:var(--muted);border-radius:var(--r1);overflow:hidden;margin-top:var(--s3)}.rail i{display:block;width:60%;height:100%;background:var(--primary)}.warning .rail i{width:93%;background:var(--warning)}.error .rail i{width:100%;background:var(--error)}.foot{display:flex;justify-content:space-between;gap:var(--s3);padding:var(--s4) var(--s6);border-top:1px solid var(--border);background:var(--surface)}.right{display:flex;gap:var(--s3)}.placeholder{padding:100px var(--s6);text-align:center}.placeholder b{display:block;color:var(--text);font-size:var(--fs-body);margin-bottom:var(--s2)}.placeholder span{color:var(--sub);line-height:1.6}.placeholder .btn{margin-top:var(--s4)}.skel{height:48px;background:var(--muted);border-radius:var(--r1);margin-bottom:var(--s4)}.success{margin:var(--s6);padding:var(--s4);border:1px solid var(--primary);background:var(--primary-soft);color:var(--success);border-radius:var(--r2)}.toast{display:none;position:fixed;bottom:var(--s6);left:50%;transform:translateX(-50%);background:var(--text);color:var(--white);padding:var(--s3) var(--s4);border-radius:var(--r1);z-index:6}.toast.on{display:block}
@media(max-width:760px){.top,.wrap{padding-left:var(--s4);padding-right:var(--s4)}.top a{display:none}.wrap{padding-top:var(--s4);overflow:hidden}.pagehead{display:block}.pagehead .btn{margin-top:var(--s3);width:100%}.form{padding:var(--s4);padding-bottom:96px}.grid{grid-template-columns:1fr}.field.full,.budgetline{grid-column:1}.budgetline{grid-template-columns:1fr}.budgetmeta{text-align:left;display:grid;grid-template-columns:1fr 1fr}.options{position:fixed;left:0;right:0;bottom:0;top:auto;border-radius:var(--r2) var(--r2) 0 0;padding:var(--s4);max-height:70vh}.foot{display:block;position:fixed;z-index:4;left:0;right:0;bottom:0;padding:var(--s3) var(--s4);box-shadow:var(--shadow)}.foot>a{display:none}.right{width:100%;min-width:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.right .btn{min-width:0;padding-left:var(--s2);padding-right:var(--s2);white-space:nowrap}.statebar b{width:100%;margin:0}h1{font-size:var(--fs-title)}}
</style></head>
<body><header class="top"><span>我的工时 / 填报工时</span><a href="index.html">返回原型总览</a></header><main class="wrap">
<div class="statebar"><b>页面状态</b><button class="on" data-state="default">默认</button><button data-state="loading">加载</button><button data-state="empty">空</button><button data-state="error">错误</button><button data-state="success">成功</button></div>
<div class="pagehead"><div><h1>填报工时</h1><p>项目类工时仅显示你所在的项目，选择后查看剩余可填工时。</p></div><button class="btn" onclick="showToast('已带入上次工时；日期与天数保持本次值')">带入上次工时</button></div>
<article class="editor">
<section class="stateview on" data-view="default"><div class="form"><div class="grid">
  <div class="field"><label>工时类型 <small>*</small></label><select class="control" id="workType" onchange="workTypeChanged()"><option value="rnd">研发项目工时</option><option value="service">技术服务工时</option><option value="management">管理工时</option></select></div>
  <div class="field"><label>填报日期 <small>*</small></label><input class="control" type="date" value="2026-10-22"></div>
  <div class="field full" id="projectField"><label>项目 <small>*</small></label><div class="picker"><button class="pickerbtn" onclick="toggleOptions()"><span><strong id="selectedName">机器人集团智能调度系统</strong><small id="selectedMeta">RND-2026-015 · 研发项目 · 你是项目成员</small></span><b>▾</b></button><div class="options" id="options">
    <button class="option selected" onclick="chooseProject('normal')"><span><strong>机器人集团智能调度系统</strong><small>RND-2026-015 · 剩余 48 人天</small></span><b>✓</b></button>
    <button class="option" onclick="chooseProject('warning')"><span><strong>柔性生产线视觉检测平台</strong><small>RND-2026-009 · 剩余 2 人天</small></span></button>
    <button class="option" onclick="chooseProject('error')"><span><strong>多模态智能巡检平台</strong><small>RND-2025-028 · 剩余 0.5 人天</small></span></button>
  </div></div><span class="helper">共 3 个你参与且允许填报的研发项目</span></div>
  <div class="budgetline" id="budgetLine"><div><h2 id="budgetTitle">剩余可填 48 人天</h2><p id="budgetDetail">本次 1 人天，提交后预计剩余 47 人天</p><div class="rail"><i></i></div></div><div class="budgetmeta"><div><span>预算</span><strong id="budgetValue">120 人天</strong></div><div><span>已占用</span><strong id="occupiedValue">72 人天</strong></div><div><span>使用率</span><strong id="rateValue">60%</strong></div></div></div>
  <div class="field"><label>开始日期 <small>*</small></label><input class="control" type="date" value="2026-10-22"></div><div class="field"><label>结束日期 <small>*</small></label><input class="control" type="date" value="2026-10-22"></div>
  <div class="field"><label>工时天数 <small>*</small></label><input class="control" id="days" type="number" min="1" value="1" oninput="recalculate()"><span class="helper">按国家法定工作日历计算</span></div><div class="field"><label>项目阶段</label><select class="control"><option>开发</option><option>测试</option><option>实施</option></select></div>
  <div class="field full"><label>工作内容 <small>*</small></label><textarea class="control">完成调度策略模块联调，修复任务队列重复执行问题。</textarea></div>
</div></div><footer class="foot"><a class="btn" href="page-02-workday-budget.html">← 上一步：预算项</a><div class="right"><button class="btn" onclick="showToast('草稿已保存，不占用项目预算')">保存草稿</button><button class="btn primary" id="submitBtn" onclick="submitWorklog()">保存并提交</button></div></footer></section>
<section class="stateview" data-view="loading"><div class="form"><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div></section>
<section class="stateview" data-view="empty"><div class="placeholder"><b>你当前没有可填报的研发项目</b><span>请联系项目负责人将你加入项目人员，或选择非项目工时类型。</span><br><button class="btn" onclick="setState('default')">重新选择工时类型</button></div></section>
<section class="stateview" data-view="error"><div class="placeholder"><b>项目预算加载失败</b><span>为避免使用过期余额，项目类工时暂不能提交。</span><br><button class="btn primary" onclick="setState('default')">重新加载预算</button></div></section>
<section class="stateview" data-view="success"><div class="success">✓ 工时已提交审批。本次占用 1 人天，项目剩余 47 人天。</div><div class="placeholder"><b>提交成功</b><span>项目负责人将收到审批通知。</span><br><button class="btn primary" onclick="setState('default')">继续填报</button></div></section>
</article></main><div class="toast" id="toast"></div>
<script>
let mode='normal';function setState(s){document.querySelectorAll('.statebar button').forEach(b=>b.classList.toggle('on',b.dataset.state===s));document.querySelectorAll('.stateview').forEach(v=>v.classList.toggle('on',v.dataset.view===s))}document.querySelector('.statebar').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setState(b.dataset.state)});function toggleOptions(){document.getElementById('options').classList.toggle('on')}
const projects={normal:{name:'机器人集团智能调度系统',meta:'RND-2026-015 · 研发项目 · 你是项目成员',budget:120,occupied:72},warning:{name:'柔性生产线视觉检测平台',meta:'RND-2026-009 · 研发项目 · 你是项目成员',budget:30,occupied:28},error:{name:'多模态智能巡检平台',meta:'RND-2025-028 · 研发项目 · 你是项目成员',budget:20,occupied:19.5}};
function chooseProject(m){mode=m;const p=projects[m];document.getElementById('selectedName').textContent=p.name;document.getElementById('selectedMeta').textContent=p.meta;document.getElementById('options').classList.remove('on');recalculate()}
function recalculate(){const p=projects[mode],days=Math.max(0,Number(document.getElementById('days').value||0)),remaining=p.budget-p.occupied,after=remaining-days,line=document.getElementById('budgetLine');line.className='budgetline';if(after<0)line.classList.add('error');else if(p.occupied/p.budget>=.8)line.classList.add('warning');document.getElementById('budgetTitle').textContent=after<0?`本次填报将超出 ${Math.abs(after)} 人天`:`剩余可填 ${remaining} 人天`;document.getElementById('budgetDetail').textContent=after<0?'请减少填报天数，或联系项目负责人调整项目人天预算':after===0?`本次 ${days} 人天，提交后预算将用完`:`本次 ${days} 人天，提交后预计剩余 ${after} 人天`;document.getElementById('budgetValue').textContent=`${p.budget} 人天`;document.getElementById('occupiedValue').textContent=`${p.occupied} 人天`;document.getElementById('rateValue').textContent=`${Math.round(p.occupied/p.budget*100)}%`;document.getElementById('submitBtn').disabled=after<0}
function workTypeChanged(){const type=document.getElementById('workType').value;document.getElementById('projectField').style.display=type==='management'?'none':'';document.getElementById('budgetLine').style.display=type==='management'?'none':'';document.getElementById('submitBtn').disabled=false}
function submitWorklog(){if(document.getElementById('submitBtn').disabled){showToast('项目剩余人天不足，不能提交');return}setState('success')}
let timer;function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(timer);timer=setTimeout(()=>t.classList.remove('on'),1800)}
</script></body></html>
