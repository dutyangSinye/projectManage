<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1700" viewBox="0 0 2000 1700" role="img" aria-labelledby="title desc">
  <title id="title">综合项目管理系统业务流程图</title>
  <desc id="desc">展示飞书免登、工时审批、合同收付款审批、项目经营更新和到期提醒的业务流程。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#94a3b8" flood-opacity=".18"/>
    </filter>
    <style>
      .title { font: 700 38px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 18px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #64748b; }
      .lane-title { font: 700 22px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #0f172a; }
      .node { font: 600 18px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #0f172a; text-anchor: middle; }
      .small { font: 400 15px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #475569; text-anchor: middle; }
      .label { font: 600 15px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #475569; }
      .box { stroke-width: 2; filter: url(#shadow); }
      .system { fill: #f0fdfa; stroke: #14b8a6; }
      .worklog { fill: #eff6ff; stroke: #60a5fa; }
      .finance { fill: #fff7ed; stroke: #fb923c; }
      .result { fill: #f0fdf4; stroke: #4ade80; }
      .neutral { fill: #f8fafc; stroke: #94a3b8; }
      .decision { fill: #fefce8; stroke: #eab308; stroke-width: 2; filter: url(#shadow); }
      .connector { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
      .dashed { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 8 8; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="2000" height="1700" fill="#f8fafc"/>
  <text x="100" y="76" class="title">综合项目管理系统 · 业务流程图</text>
  <text x="100" y="112" class="subtitle">飞书负责身份与通知，系统负责业务校验、审批操作和项目经营数据</text>

  <rect x="100" y="150" width="1800" height="180" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="135" y="187" class="lane-title">统一入口</text>
  <rect x="190" y="215" width="260" height="76" rx="12" class="box system"/>
  <text x="320" y="247" class="node"><tspan x="320" dy="0">飞书内打开系统</tspan><tspan x="320" dy="26" class="small">免登进入</tspan></text>
  <rect x="620" y="215" width="280" height="76" rx="12" class="box system"/>
  <text x="760" y="247" class="node"><tspan x="760" dy="0">身份与组织校验</tspan><tspan x="760" dy="26" class="small">用户、部门、上级</tspan></text>
  <rect x="1070" y="215" width="260" height="76" rx="12" class="box neutral"/>
  <text x="1200" y="247" class="node"><tspan x="1200" dy="0">菜单与数据权限</tspan><tspan x="1200" dy="26" class="small">管理员配置</tspan></text>
  <rect x="1500" y="215" width="260" height="76" rx="12" class="box result"/>
  <text x="1630" y="247" class="node"><tspan x="1630" dy="0">工作台</tspan><tspan x="1630" dy="26" class="small">员工区 / 项目负责人区</tspan></text>
  <path d="M450 253 H620" class="connector"/><path d="M900 253 H1070" class="connector"/><path d="M1330 253 H1500" class="connector"/>

  <rect x="100" y="380" width="1800" height="570" rx="18" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="135" y="425" class="lane-title">员工工时流程 · 每条工时单独审批</text>
  <rect x="150" y="475" width="220" height="82" rx="12" class="box worklog"/>
  <text x="260" y="510" class="node"><tspan x="260">填报工时</tspan><tspan x="260" dy="26" class="small">项目、日期、描述</tspan></text>
  <rect x="440" y="475" width="240" height="82" rx="12" class="box worklog"/>
  <text x="560" y="510" class="node"><tspan x="560">筛选项目</tspan><tspan x="560" dy="26" class="small">先选项目类型</tspan></text>
  <rect x="750" y="475" width="260" height="82" rx="12" class="box worklog"/>
  <text x="880" y="510" class="node"><tspan x="880">业务规则校验</tspan><tspan x="880" dy="26" class="small">同月、区间、不重复</tspan></text>
  <rect x="1080" y="475" width="240" height="82" rx="12" class="box worklog"/>
  <text x="1200" y="510" class="node"><tspan x="1200">提交审批</tspan><tspan x="1200" dy="26" class="small">创建本地任务</tspan></text>
  <rect x="1390" y="475" width="280" height="82" rx="12" class="box system"/>
  <text x="1530" y="510" class="node"><tspan x="1530">飞书卡片通知审批人</tspan><tspan x="1530" dy="26" class="small">点击进入系统详情</tspan></text>
  <path d="M370 516 H440" class="connector"/><path d="M680 516 H750" class="connector"/><path d="M1010 516 H1080" class="connector"/><path d="M1320 516 H1390" class="connector"/>
  <rect x="240" y="700" width="270" height="82" rx="12" class="box neutral"/>
  <text x="375" y="735" class="node"><tspan x="375">审批人查看详情</tspan><tspan x="375" dy="26" class="small">查看完整工时信息</tspan></text>
  <polygon points="670,688 790,741 670,794 550,741" class="decision"/>
  <text x="670" y="737" class="node"><tspan x="670">审批通过？</tspan></text>
  <rect x="930" y="700" width="300" height="82" rx="12" class="box result"/>
  <text x="1080" y="735" class="node"><tspan x="1080">通过：生成成本流水</tspan><tspan x="1080" dy="26" class="small">更新人天、成本和看板</tspan></text>
  <rect x="1390" y="700" width="280" height="82" rx="12" class="box finance"/>
  <text x="1530" y="735" class="node"><tspan x="1530">驳回：填写意见</tspan><tspan x="1530" dy="26" class="small">通知填报人修改</tspan></text>
  <path d="M1530 557 V630 H375 V700" class="connector"/>
  <path d="M510 741 H550" class="connector"/>
  <path d="M790 741 H930" class="connector"/><text x="850" y="725" class="label">是</text>
  <path d="M670 794 V855 H1530 V782" class="connector"/><text x="760" y="845" class="label">否</text>
  <rect x="700" y="855" width="400" height="58" rx="12" class="box neutral"/>
  <text x="900" y="890" class="node">我的工时、工时审批、工时看板同步更新</text>

  <rect x="100" y="1000" width="1800" height="560" rx="18" fill="#ffffff" stroke="#fed7aa" stroke-width="2"/>
  <text x="135" y="1045" class="lane-title">项目经营流程 · 合同、阶段与收付款</text>
  <rect x="150" y="1095" width="250" height="82" rx="12" class="box finance"/>
  <text x="275" y="1130" class="node"><tspan x="275">维护项目主信息</tspan><tspan x="275" dy="26" class="small">类型、负责人、预算</tspan></text>
  <rect x="480" y="1095" width="250" height="82" rx="12" class="box finance"/>
  <text x="605" y="1130" class="node"><tspan x="605">配置合同</tspan><tspan x="605" dy="26" class="small">收入合同 / 支出合同</tspan></text>
  <rect x="810" y="1095" width="250" height="82" rx="12" class="box finance"/>
  <text x="935" y="1130" class="node"><tspan x="935">配置合同阶段</tspan><tspan x="935" dy="26" class="small">计划金额和到期日</tspan></text>
  <polygon points="1220,1080 1350,1136 1220,1192 1090,1136" class="decision"/>
  <text x="1220" y="1132" class="node">收款还是付款？</text>
  <rect x="1430" y="1055" width="260" height="72" rx="12" class="box finance"/>
  <text x="1560" y="1085" class="node"><tspan x="1560">新增收款单</tspan><tspan x="1560" dy="24" class="small">收入合同阶段</tspan></text>
  <rect x="1430" y="1195" width="260" height="72" rx="12" class="box finance"/>
  <text x="1560" y="1225" class="node"><tspan x="1560">新增付款单</tspan><tspan x="1560" dy="24" class="small">支出合同阶段</tspan></text>
  <path d="M400 1136 H480" class="connector"/><path d="M730 1136 H810" class="connector"/><path d="M1060 1136 H1090" class="connector"/>
  <path d="M1350 1136 H1390 V1091 H1430" class="connector"/><text x="1370" y="1113" class="label">收款</text>
  <path d="M1350 1136 H1390 V1231 H1430" class="connector"/><text x="1370" y="1214" class="label">付款</text>
  <rect x="650" y="1325" width="280" height="78" rx="12" class="box system"/>
  <text x="790" y="1358" class="node"><tspan x="790">飞书通知出纳</tspan><tspan x="790" dy="25" class="small">进入单据详情审批</tspan></text>
  <rect x="1030" y="1325" width="270" height="78" rx="12" class="box neutral"/>
  <text x="1165" y="1358" class="node"><tspan x="1165">出纳审批</tspan><tspan x="1165" dy="25" class="small">通过或驳回</tspan></text>
  <rect x="1400" y="1325" width="360" height="78" rx="12" class="box result"/>
  <text x="1580" y="1358" class="node"><tspan x="1580">经营流水更新</tspan><tspan x="1580" dy="25" class="small">已收/已付、应收/应付、毛利</tspan></text>
  <path d="M1560 1127 V1280 H790 V1325" class="connector"/>
  <path d="M1560 1267 V1280 H790 V1325" class="connector"/>
  <path d="M930 1364 H1030" class="connector"/><path d="M1300 1364 H1400" class="connector"/>
  <rect x="350" y="1450" width="450" height="62" rx="12" class="box result"/>
  <text x="575" y="1487" class="node">项目概况、项目看板和预警刷新</text>
  <rect x="930" y="1450" width="450" height="62" rx="12" class="box system"/>
  <text x="1155" y="1487" class="node">阶段到期 / 逾期提醒项目负责人</text>
  <path d="M1580 1403 V1430 H575 V1450" class="connector"/>
  <path d="M935 1177 V1420 H1155 V1450" class="dashed"/>

  <rect x="100" y="1610" width="1800" height="58" rx="12" fill="#e2e8f0"/>
  <text x="1000" y="1647" class="small">业务数据统一保存在系统数据库；飞书用于免登、组织架构和应用消息通知</text>
</svg>
