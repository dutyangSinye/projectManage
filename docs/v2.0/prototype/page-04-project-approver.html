<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>项目审批人 · 芯烨工时管理系统</title><style>
:root{--primary:#087f72;--success:#16803c;--warning:#b45309;--page:#f4f7f7;--card:#fff;--text:#172b2a;--muted:#607271;--line:#dce7e5;--soft:#e8f3f1;--radius:8px}*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--text);font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif}.main{max-width:1100px;margin:auto;padding:32px 24px}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:24px}.head h1{font-size:28px;margin:0 0 8px}.muted{color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px}.toolbar{display:flex;justify-content:space-between;gap:12px;margin-bottom:16px}.tools{display:flex;gap:8px;flex-wrap:wrap}select,.btn{min-height:44px;border:1px solid var(--line);border-radius:6px;background:#fff;padding:0 14px;font:inherit}.btn{cursor:pointer}.primary{background:var(--primary);border-color:var(--primary);color:#fff}.row{display:grid;grid-template-columns:1.5fr 1fr 1fr 110px;gap:16px;align-items:center;padding:15px 0;border-bottom:1px solid var(--line)}.row.head{font-size:12px;color:var(--muted);padding-top:0}.row:last-child{border-bottom:0}.tag{padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--primary);font-size:12px}.state{display:none}.state-default{display:block}body[data-state="loading"] .state-default,body[data-state="empty"] .state-default,body[data-state="error"] .state-default,body[data-state="success"] .state-default{display:none}body[data-state="loading"] .state-loading,body[data-state="empty"] .state-empty,body[data-state="error"] .state-error,body[data-state="success"] .state-success{display:block}.notice{padding:14px;border-radius:6px;border:1px solid var(--line);background:#fff}.error{color:#c2413b;border-color:#f2b8b4;background:#fff5f4}.success{color:var(--success);border-color:#bce1c8;background:#f1fbf4}.switcher{position:fixed;right:16px;bottom:16px;background:#173432;color:#fff;padding:8px;border-radius:8px;display:flex;gap:4px;align-items:center}.switcher button{border:0;background:transparent;color:#d9e8e6;padding:6px 8px;cursor:pointer;border-radius:4px}.switcher button.active,.switcher button:hover{background:#3b7770}@media(max-width:760px){.main{padding:20px 16px}.head,.toolbar{display:block}.head .tools,.toolbar .tools{margin-top:14px}.row{grid-template-columns:1fr 1fr}.row.head{display:none}}
</style></head><body data-state="default"><main class="main"><div class="muted">管理 / <strong>项目审批人</strong></div><div class="head"><div><h1>项目审批人</h1><div class="muted">每个项目配置一位工时审批人</div></div><div class="tools"><input aria-label="搜索项目" placeholder="搜索项目" style="min-height:44px;border:1px solid var(--line);border-radius:6px;padding:0 12px;font:inherit"><button class="btn primary">保存变更</button></div></div><div class="state state-default"><section class="card"><div class="toolbar"><div><strong>项目配置</strong><div class="muted">审批人变更只影响新提交的工时</div></div><select><option>全部状态</option><option>可填报</option><option>已暂停</option></select></div><div class="row head"><span>项目</span><span>项目负责人</span><span>当前审批人</span><span>填报状态</span></div><div class="row"><span><strong>机器人集群智能调度管理系统</strong><br><small class="muted">PRJ-2026-007</small></span><span>杨阳</span><span><select><option>樊公海 · 项目管理部</option><option>陈总 · 项目管理部</option></select></span><span><span class="tag">可填报</span></span></div><div class="row"><span><strong>自动化钢筋加工产线</strong><br><small class="muted">PRJ-2026-009</small></span><span>樊公海</span><span><select><option>陈总 · 项目管理部</option><option>樊公海 · 项目管理部</option></select></span><span><span class="tag">可填报</span></span></div><div class="row"><span><strong>建筑物流搬运机器人研发与应用</strong><br><small class="muted">PRJ-2026-004</small></span><span>李明</span><span><select><option>樊公海 · 研发中心</option><option>陈总 · 项目管理部</option></select></span><span><span class="tag">可填报</span></span></div></section></div><div class="state state-loading"><div class="card"><strong>正在加载项目配置</strong><p class="muted">正在读取项目和组织用户…</p></div></div><div class="state state-empty"><div class="card"><strong>暂无可配置项目</strong><p class="muted">请先同步项目数据。</p></div></div><div class="state state-error"><div class="notice error"><strong>项目配置加载失败</strong><p>请检查组织用户同步状态。</p><button class="btn" onclick="setState('default')">重新加载</button></div></div><div class="state state-success"><div class="notice success"><strong>保存成功</strong><p>项目审批人配置已更新，新提交工时将使用新的审批人。</p></div></div></main><div class="switcher"><span>状态</span><button class="active" data-state="default">默认</button><button data-state="loading">加载</button><button data-state="empty">空</button><button data-state="error">错误</button><button data-state="success">成功</button></div><script>function setState(s){document.body.dataset.state=s;document.querySelectorAll('.switcher button').forEach(b=>b.classList.toggle('active',b.dataset.state===s))}document.querySelectorAll('.switcher button').forEach(b=>b.onclick=()=>setState(b.dataset.state))</script></body></html>
